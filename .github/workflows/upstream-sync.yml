name: Sync Upstream & Release Automation

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync regardless of changes'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync-upstream:
    name: Sync Official CodexBar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        run: |
          git remote add upstream https://github.com/steipete/CodexBar.git || true
          git fetch upstream --tags

      - name: Check for upstream updates
        id: check_upstream
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          LOCAL_UPSTREAM_BASE=$(git merge-base HEAD upstream/main 2>/dev/null || echo "")
          echo "upstream_head=$UPSTREAM_HEAD" >> "$GITHUB_OUTPUT"
          
          LATEST_UPSTREAM_TAG=$(git tag -l --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || echo "")
          echo "latest_tag=$LATEST_UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

          if [ "$UPSTREAM_HEAD" != "$LOCAL_UPSTREAM_BASE" ] || [ "${{ inputs.force_sync }}" = "true" ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fast-forward / merge upstream changes
        if: steps.check_upstream.outputs.has_updates == 'true'
        run: |
          echo "Merging upstream/main into current branch..."
          git merge upstream/main -m "chore(upstream): sync official changes from steipete/CodexBar" || {
            echo "Merge conflict detected during upstream sync. Please review manually."
            exit 1
          }
          git push origin HEAD
