name: Multi-Platform Release (macOS, Linux, Windows 11)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag name (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # 1. macOS Build (GUI CodexBar.app DMG + CodexBarCLI)
  # -------------------------------------------------------------------------
  build-macos:
    name: Build macOS (Universal App + CLI)
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer" >> "$GITHUB_ENV"
          /usr/bin/xcodebuild -version

      - name: Build CodexBarCLI (Release arm64 and x86_64)
        run: |
          mkdir -p dist
          # Build arm64
          swift build -c release --arch arm64 --product CodexBarCLI
          mkdir -p dist/cli-macos-arm64
          BIN_DIR_ARM64=$(swift build -c release --arch arm64 --product CodexBarCLI --show-bin-path)
          if [ -f "$BIN_DIR_ARM64/CodexBarCLI" ]; then
            cp "$BIN_DIR_ARM64/CodexBarCLI" dist/cli-macos-arm64/CodexBarCLI
          else
            CLI_FOUND=$(find .build -name "CodexBarCLI" -perm +111 -type f | head -n 1)
            cp "$CLI_FOUND" dist/cli-macos-arm64/CodexBarCLI
          fi
          tar -czvf "dist/CodexBarCLI-macos-arm64.tar.gz" -C dist/cli-macos-arm64 CodexBarCLI

          # Build x86_64
          swift build -c release --arch x86_64 --product CodexBarCLI || true
          mkdir -p dist/cli-macos-x86_64
          BIN_DIR_X86=$(swift build -c release --arch x86_64 --product CodexBarCLI --show-bin-path 2>/dev/null || true)
          if [ -n "$BIN_DIR_X86" ] && [ -f "$BIN_DIR_X86/CodexBarCLI" ]; then
            cp "$BIN_DIR_X86/CodexBarCLI" dist/cli-macos-x86_64/CodexBarCLI
            tar -czvf "dist/CodexBarCLI-macos-x86_64.tar.gz" -C dist/cli-macos-x86_64 CodexBarCLI
          fi

      - name: Build macOS GUI App
        run: |
          xcodebuild -project codexbar.xcodeproj -scheme codexbar -configuration Release CODE_SIGNING_ALLOWED=NO -destination 'platform=macOS' -derivedDataPath .build/DerivedData build
          BUILT_APP=$(find .build/DerivedData -name "codexbar.app" -type d | head -n 1)
          if [ -n "$BUILT_APP" ]; then
            mkdir -p dist/dmg-staging
            cp -R "$BUILT_APP" dist/dmg-staging/CodexBar.app
            mkdir -p dist/dmg-staging/CodexBar.app/Contents/Helpers
            if [ -f dist/cli-macos-arm64/CodexBarCLI ]; then
              cp dist/cli-macos-arm64/CodexBarCLI dist/dmg-staging/CodexBar.app/Contents/Helpers/
            fi
            hdiutil create -volname "CodexBar" -srcfolder dist/dmg-staging -ov -format UDZO dist/CodexBar-macOS.dmg
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*.dmg
          if-no-files-found: ignore

      - name: Upload macOS CLI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-cli-artifacts
          path: dist/*.tar.gz
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # 2. Linux Build (CLI x86_64 & aarch64)
  # -------------------------------------------------------------------------
  build-linux:
    name: Build Linux CLI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies & Swift via swiftly
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates gpg curl libsqlite3-dev
          SWIFTLY_VERSION="1.1.3"
          SWIFTLY_ARCH="$(uname -m)"
          SWIFTLY_ARCHIVE="$RUNNER_TEMP/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz"
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz" -o "$SWIFTLY_ARCHIVE"
          tar -xzf "$SWIFTLY_ARCHIVE" -C /tmp
          /tmp/swiftly init --assume-yes --skip-install
          SWIFTLY_HOME_DIR="$HOME/.local/share/swiftly"
          SWIFTLY_BIN_DIR="$HOME/.local/bin"
          . "$SWIFTLY_HOME_DIR/env.sh"
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"
          POST_INSTALL_SCRIPT="$(mktemp)"
          swiftly install 6.3.3 --use --assume-yes --post-install-file "$POST_INSTALL_SCRIPT" || swiftly install 6.2 --use --assume-yes --post-install-file "$POST_INSTALL_SCRIPT"
          if [[ -s "$POST_INSTALL_SCRIPT" ]]; then
            sudo apt-get update
            sudo bash "$POST_INSTALL_SCRIPT"
          fi
          hash -r
          swift --version

      - name: Build CodexBarCLI (Linux x86_64)
        run: |
          swift build -c release --product CodexBarCLI
          mkdir -p dist/cli-linux-x86_64
          cp .build/release/CodexBarCLI dist/cli-linux-x86_64/
          cd dist/cli-linux-x86_64
          tar -czvf "../CodexBarCLI-linux-x86_64.tar.gz" CodexBarCLI

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-cli-artifacts
          path: dist/*.tar.gz
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # 3. Windows 11 Build (CodexBarCLI.exe x64)
  # -------------------------------------------------------------------------
  build-windows:
    name: Build Windows 11 CLI
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Swift for Windows
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.0-release
          tag: 6.0-RELEASE

      - name: Build CodexBarCLI on Windows
        shell: pwsh
        run: |
          swift build -c release --product CodexBarCLI
          New-Item -ItemType Directory -Force -Path dist\cli-windows-x64
          $exe = Get-ChildItem -Path .build -Filter "CodexBarCLI.exe" -Recurse | Select-Object -First 1
          if ($exe) {
              Copy-Item $exe.FullName dist\cli-windows-x64\
          } else {
              Write-Error "CodexBarCLI.exe not found in .build"
              exit 1
          }
          
          # Create a lightweight PowerShell setup script for Windows
          @'
          param([string]$InstallDir = "$env:LOCALAPPDATA\Programs\CodexBar")
          New-Item -ItemType Directory -Force -Path $InstallDir | Out-Null
          Copy-Item ".\CodexBarCLI.exe" "$InstallDir\codexbar.exe" -Force
          [Environment]::SetEnvironmentVariable("Path", $env:Path + ";$InstallDir", [EnvironmentVariableTarget]::User)
          Write-Host "CodexBar successfully installed to $InstallDir\codexbar.exe"
          '@ | Out-File -Encoding UTF8 dist\cli-windows-x64\setup.ps1

          Compress-Archive -Path dist\cli-windows-x64\* -DestinationPath dist\CodexBarCLI-windows-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-cli-artifacts
          path: dist/*.zip
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # 4. Publish Release Assets
  # -------------------------------------------------------------------------
  publish-release:
    name: Publish Release Assets
    needs: [build-macos, build-linux, build-windows]
    if: always() && !cancelled() && needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt || true

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: CodexBar ${{ steps.release_tag.outputs.tag }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
