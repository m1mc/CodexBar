name: Multi-Platform Release (macOS, Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag name (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # 1. macOS Build (GUI CodexBar.app DMG + CodexBarCLI)
  # -------------------------------------------------------------------------
  build-macos:
    name: Build macOS (App)
    runs-on: xcode-27
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer" >> "$GITHUB_ENV"
          /usr/bin/xcodebuild -version

      - name: Resolve release version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*([-.][A-Za-z0-9]+)*$ ]] || { echo "Invalid release tag: $TAG" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build macOS GUI App
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The bundle version must equal the cask version, or the in-app Homebrew updater never settles.
          CODEXBAR_SIGNING=adhoc CODEXBAR_MARKETING_VERSION="$VERSION" ./Scripts/package_app.sh release
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' CodexBar.app/Contents/Info.plist)" = "$VERSION"
          mkdir -p dist
          ./Scripts/package_dmg.sh --app CodexBar.app --version "$VERSION" --output dist/CodexBar-macOS.dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*.dmg
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # 2. CLI (official reusable workflow: macOS arm64/x86_64, Linux glibc + musl)
  #    Packages CodexBarCLI, the codexbar link, VERSION, notices and the core
  #    resource bundle exactly like upstream releases.
  # -------------------------------------------------------------------------
  build-cli:
    name: Build CLI (all platforms)
    permissions:
      contents: read
    uses: ./.github/workflows/release-cli.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      tag: ${{ inputs.tag || github.ref_name }}

  # -------------------------------------------------------------------------
  # 3. Linux Desktop (archive + Debian package)
  # -------------------------------------------------------------------------
  build-linux-desktop:
    name: Build Linux Desktop (archive + deb)
    needs: [build-macos]
    uses: ./.github/workflows/release-linux-desktop.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      version: ${{ needs.build-macos.outputs.version }}

  # -------------------------------------------------------------------------
  # 4. Publish Release Assets
  # -------------------------------------------------------------------------
  publish-release:
    name: Publish Release Assets
    needs: [build-macos, build-cli, build-linux-desktop]
    if: always() && !cancelled() && needs.build-macos.result == 'success' && needs.build-cli.result == 'success' && needs.build-linux-desktop.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt || true

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: CodexBar ${{ steps.release_tag.outputs.tag }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true

      # The GUI updater reads Casks/codexbar.rb from main, so publishing it closes the update loop.
      - name: Checkout main for distribution manifests
        uses: actions/checkout@v4
        with:
          ref: main
          path: distribution

      - name: Point Homebrew cask and formula at this release
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        working-directory: distribution
        run: |
          set -euo pipefail
          python3 Scripts/update_distribution_manifests.py "$TAG" ../release-assets .
          if git diff --quiet -- Casks/codexbar.rb Formula/codexbar.rb; then
            echo "Distribution manifests already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(distribution): update formula and cask checksums for release $TAG" \
            -- Casks/codexbar.rb Formula/codexbar.rb
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
